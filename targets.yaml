# Each key under "bots" becomes a control-bot command: bot-1 -> /bot-1
# Add or remove entries freely - no code changes or restart needed,
# the control bot re-reads this file on every command.
#
# Step actions:
#   send      -> {"action": "send", "text": "/start"}
#   wait      -> {"action": "wait", "seconds": 2}
#   click     -> {"action": "click", "text": "Получить", "timeout": 20}
#                timeout is optional (default 20s) and limits how long the
#                runner waits for a matching button to APPEAR. Matching is a
#                case-insensitive substring test, so "Получить" also matches
#                "Получить VPN", "Получить конфиг", "получить КЛЮЧ".
#                Only the target bot's own buttons are ever clicked.
#   subscribe -> {"action": "subscribe", "chat": "@example_channel", "timeout": 20}
#                or {"action": "subscribe", "invite": "https://t.me/+xxxx"}
#                Joins the chat with the USERBOT account - but only if it is
#                not already a member. Membership is verified afterwards.
#                timeout is optional (default 20s). If joining requires
#                approval, CAPTCHA or anything else that cannot be done
#                automatically, the scenario stops with a clear error.
#   extract   -> {"action": "extract"}
#                scans EVERY message received from the target bot during this
#                run for vless:// links (not just the last one), dedupes them
#                and saves the new ones into SQLite.
#
# Config mistakes are reported before the scenario starts, e.g.:
#   bot-1: step 3: action 'click' requires field 'text'

bots:
  bot-1:
    username: VoxiProxy_bot
    steps:
      - action: send
        text: "/start"
      - action: wait
        seconds: 2
      - action: subscribe
        chat: "@voxiproxynews"
        timeout: 20
      - action: click
        text: "Я подписался"
        timeout: 20
      - action: click
        text: "Пропустить"
        timeout: 20
      - action: wait
        seconds: 3
      - action: click
        text: "Получить пробный период"
        timeout: 20
      - action: click
        text: "Активировать"
        timeout: 20
      - action: wait
        seconds: 3
      - action: extract

  bot-2:
    username: veltrovpn_bot
    steps: 
      - action: send
        text: "/start"
      - action: wait
        seconds: 2
      - action: subscribe
        chat: "@veltrovpn_channel"
        timeout: 20
      - action: click
        text: "Подписался"
      - action: wait
        seconds: 20
      - action: click
        text: "Пропустить"
      - action: wait
        seconds: 20
      - action: click
        text: "Тестовая"
      - action: wait
        seconds: 20
      - action: click
        text: "Активировать"
      - action: extract

  # Bot that first requires a subscription to a channel:
  bot-3:
    username: example_vpn_bot_3
    steps:
      - action: send
        text: "/start"
      - action: wait
        seconds: 2
      - action: subscribe
        chat: "@example_channel"
        timeout: 20
      - action: wait
        seconds: 2
      - action: click
        text: "Проверить подписку"
        timeout: 20
      - action: wait
        seconds: 3
      - action: extract
